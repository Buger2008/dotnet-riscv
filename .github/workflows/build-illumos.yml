name: Build .NET SDK for illumos-x64

on:
  workflow_dispatch:
    inputs:
      fork:
        description: 'dotnet VMR fork name'
        required: true
        type: string
        default: dotnet
      branch:
        description: 'dotnet VMR branch name'
        required: true
        type: string
        default: main
      is_rtm:
        description: 'is RTM build'
        type: boolean
        default: false
      release:
        description: 'publish release'
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: illumos
            docker_tag: ubuntu-22.04-cross-illumos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@v4.1
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'true'

    - name: Clone repository
      run: |
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet

    - name: Build
      run: |
        docker run --platform linux/amd64 --rm -v${{ github.workspace }}/dotnet:/dotnet -w /dotnet -e ROOTFS_DIR=/crossrootfs/x64 -e Compiler=gcc \
          mcr.microsoft.com/dotnet-buildtools/prereqs:${{ matrix.docker_tag }} \
            bash -c '
              set -e
              # The runtime build defaults to ninja (eng/native/build-commons.sh sets
              # __UseNinja=1) and hard-fails with "Unable to locate ninja!", but the
              # prereqs image ships no ninja. Install it before building.
              if ! command -v ninja >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                # The image references apt.kitware.com but its signing key is not in the
                # keyring, which makes a plain "apt-get update" abort with exit code 100.
                # Drop that source; ninja-build comes from the Ubuntu archive.
                for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
                  [ -f "$f" ] || continue
                  grep -q apt.kitware.com "$f" || continue
                  if [ "$f" = /etc/apt/sources.list ]; then
                    sed -i "/apt.kitware.com/d" "$f"
                  else
                    rm -f "$f"
                  fi
                done
                apt-get update -o Acquire::AllowInsecureRepositories=true
                apt-get install -y --no-install-recommends ninja-build || true
                # Fallback in case ninja-build is not in the enabled components.
                command -v ninja >/dev/null 2>&1 || python3 -m pip install --no-cache-dir --quiet ninja || true
                command -v ninja >/dev/null 2>&1 || { echo "==> unable to install ninja"; exit 1; }
              fi
              echo "==> ninja: $(ninja --version)"
              exec "$@"
            ' _ \
              ./build.sh --clean-while-building --prep -sb --os ${{ matrix.name }} --rid ${{ matrix.name }}-x64 \
                --arch x64 ${{ inputs.is_rtm && '--branding rtm' || '' }} -p:OfficialBuildId=$(date +%Y%m%d).99

    - name: List assets directory
      run: |
        find "${{ github.workspace }}/dotnet/artifacts"

    - name: Upload .NET
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-sdk-${{ matrix.name }}
        path: |
          ${{ github.workspace }}/dotnet/artifacts/assets/Release/Sdk/*/dotnet-sdk-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ inputs.release }}
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Make release
      run: |
        sudo apt install -y hub

        # hub(1) requires release to be created inside a git repo
        git clone https://${{ secrets.CLONE_TOKEN }}:x-oauth-basic@github.com/${{ github.repository }}.git repo
        cd repo

        sdk_paths=$(find ${{ github.workspace }}/artifacts -name 'dotnet-sdk-*.tar.gz')
        artifacts=""
        for sdk_path in $sdk_paths; do
          sdk_filename=$(basename "$sdk_path")
          # Extract version: strip prefix/suffix to get e.g. "10.0.100-preview.5.25277.114"
          sdk_version=$(echo "$sdk_filename" | sed -E 's/dotnet-sdk-([^-]+(-[^-]+)*)-illumos-.+\.tar\.gz/\1/')
          artifacts="$artifacts -a $sdk_path"
          tag_name="$sdk_version"
        done

        echo "tag_name: $tag_name"
        echo "artifacts: $artifacts"

        # docs: https://hub.github.com/hub-release.1.html
        hub release create $artifacts --prerelease -m "$tag_name" "$tag_name"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
