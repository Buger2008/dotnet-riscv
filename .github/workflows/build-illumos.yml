name: Build .NET SDK for illumos-x64

on:
  workflow_dispatch:
    inputs:
      fork:
        description: 'dotnet VMR fork name'
        required: true
        type: string
        default: dotnet
      branch:
        description: 'dotnet VMR branch name'
        required: true
        type: string
        default: main
      is_rtm:
        description: 'is RTM build'
        type: boolean
        default: false
      release:
        description: 'publish release'
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: illumos
            docker_tag: ubuntu-22.04-cross-illumos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@v4.1
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'true'

    - name: Clone repository
      run: |
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet

    - name: Build
      run: |
        docker run --platform linux/amd64 --rm -v${{ github.workspace }}/dotnet:/dotnet -w /dotnet -e ROOTFS_DIR=/crossrootfs/x64 -e Compiler=gcc \
          mcr.microsoft.com/dotnet-buildtools/prereqs:${{ matrix.docker_tag }} \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              # The image references apt.kitware.com but its signing key is not in the
              # keyring, which makes a plain "apt-get update" abort with exit code 100.
              # Drop that source; cmake is already installed so nothing needs it.
              for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
                [ -f "$f" ] || continue
                grep -q apt.kitware.com "$f" || continue
                if [ "$f" = /etc/apt/sources.list ]; then
                  sed -i "/apt.kitware.com/d" "$f"
                else
                  rm -f "$f"
                fi
              done
              apt-get update -o Acquire::AllowInsecureRepositories=true
              # ninja: the runtime build defaults to ninja (__UseNinja=1 in
              # eng/native/build-commons.sh) and hard-fails with "Unable to locate
              # ninja!" when it is missing.
              # lld: the build passes -fuse-ld=lld to the illumos cross gcc, but the
              # image ships no lld at all.
              apt-get install -y --no-install-recommends ninja-build lld || true
              command -v ninja >/dev/null 2>&1 || python3 -m pip install --no-cache-dir --quiet ninja || true
              command -v ninja >/dev/null 2>&1 || { echo "==> unable to install ninja"; exit 1; }
              echo "==> ninja: $(command -v ninja) $(ninja --version)"
              echo "==> lld: $(command -v ld.lld || command -v lld || echo MISSING)"

              # The illumos cross gcc resolves its linker inside its own target
              # directory (<exec-prefix>/<target>/bin/ld), so a linker installed
              # into the PATH is not enough: the build inherits -fuse-ld=lld from
              # the clang-based compiler setup and then dies with
              # "collect2: fatal error: cannot find 'ld'".
              # Probe the actual link, then force the bfd (GNU ld) linker, which is
              # the one this toolchain actually ships.
              CROSS_BIN=/crossrootfs/x64/bin
              CROSS_CC=$CROSS_BIN/x86_64-illumos-gcc
              printf "int main(void){return 0;}\n" > /tmp/probe.c
              cross_link() {
                "$CROSS_CC" --sysroot=/crossrootfs/x64 "$@" /tmp/probe.c -o /tmp/probe -lssp
              }
              echo "==> gcc -print-prog-name=ld -> $("$CROSS_CC" -print-prog-name=ld 2>/dev/null || true)"
              for cand in "" "-fuse-ld=lld" "-fuse-ld=bfd"; do
                if cross_link $cand >/dev/null 2>/tmp/probe.err; then
                  used=$("$CROSS_CC" -v --sysroot=/crossrootfs/x64 $cand /tmp/probe.c -o /tmp/probe -lssp 2>&1 | tail -1 || true)
                  echo "==> cross link OK    : ${cand:-<compiler default>} :: ${used:-unknown}"
                else
                  echo "==> cross link FAILED: ${cand:-<compiler default>}"
                  sed -n "1,3p" /tmp/probe.err
                fi
              done

              # EXTRA_LDFLAGS cannot be relied on here: the VMR runs each repo build
              # in a sanitised child environment, so the variable never reaches
              # eng/native/build-commons.sh. Instead make the requested linker name
              # resolve where this cross gcc actually looks for it, and verify it by
              # linking for real. TARGET_BIN is the compiler own tool directory.
              TARGET_BIN=$(dirname "$("$CROSS_CC" -print-prog-name=ld 2>/dev/null || echo /crossrootfs/x64/x86_64-sun-solaris2.11/bin/ld)")
              CROSS_LD=$TARGET_BIN/ld
              if ! cross_link -fuse-ld=lld >/dev/null 2>&1; then
                echo "==> -fuse-ld=lld has no linker of that name; aliasing the lld name to the toolchain GNU ld"
                for p in "$TARGET_BIN/ld.lld" "$TARGET_BIN/x86_64-sun-solaris2.11-ld.lld" \
                         "$CROSS_BIN/ld.lld" "$CROSS_BIN/x86_64-illumos-ld.lld"; do
                  [ -e "$p" ] && continue
                  mkdir -p "$(dirname "$p")"
                  ln -sf "$CROSS_LD" "$p"
                  echo "==> aliased $p -> $CROSS_LD"
                  if cross_link -fuse-ld=lld >/dev/null 2>&1; then
                    echo "==> -fuse-ld=lld now links"
                    break
                  fi
                done
              fi
              if cross_link -fuse-ld=lld >/dev/null 2>&1; then
                echo "==> link check passed with -fuse-ld=lld"
              else
                echo "==> still cannot link with -fuse-ld=lld; failing fast"
                exit 1
              fi
              # GCC 13 raises a false positive in src/coreclr/vm/common.h (the
              # inlined memcpy in memcpyNoGCRefs) that -Werror turns into a hard
              # failure: "error: reading 16 bytes from a region of size 0
              # [-Werror=stringop-overread]". configurecompiler.cmake already
              # suppresses the sibling warnings for GCC, so add this one there.
              # Env vars (CFLAGS/EXTRA_*) cannot be used: the VMR runs the repo
              # builds in a sanitised child environment.
              CCF=/dotnet/src/runtime/eng/native/configurecompiler.cmake
              if [ -f "$CCF" ] && ! grep -q stringop-overread "$CCF"; then
                sed -i "s#COMPILE_LANGUAGE:CXX>:-Wno-stringop-overflow>)#COMPILE_LANGUAGE:CXX>:-Wno-stringop-overflow>)\n    add_compile_options(\$<\$<COMPILE_LANGUAGE:CXX>:-Wno-stringop-overread>)#" "$CCF"
              fi
              if grep -q stringop-overread "$CCF" 2>/dev/null; then
                echo "==> suppressed: $(grep -n stringop-overread "$CCF" | tr "\n" " ")"
              else
                echo "==> could not patch configurecompiler.cmake; wrapping the cross compilers instead"
                for comp in gcc g++; do
                  real=/crossrootfs/x64/bin/x86_64-illumos-$comp-real
                  if [ ! -e "$real" ]; then
                    mv "/crossrootfs/x64/bin/x86_64-illumos-$comp" "$real"
                    printf "%s\n" "#!/bin/sh" "exec $real -Wno-stringop-overread \"\$@\"" > "/crossrootfs/x64/bin/x86_64-illumos-$comp"
                    chmod +x "/crossrootfs/x64/bin/x86_64-illumos-$comp"
                  fi
                done
                echo "==> cross compilers wrapped with -Wno-stringop-overread"
              fi
              exec "$@"
            ' _ \
              ./build.sh --clean-while-building --prep -sb --os ${{ matrix.name }} --rid ${{ matrix.name }}-x64 \
                --arch x64 ${{ inputs.is_rtm && '--branding rtm' || '' }} -p:OfficialBuildId=$(date +%Y%m%d).99

    - name: List assets directory
      run: |
        find "${{ github.workspace }}/dotnet/artifacts"

    - name: Upload .NET
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-sdk-${{ matrix.name }}
        path: |
          ${{ github.workspace }}/dotnet/artifacts/assets/Release/Sdk/*/dotnet-sdk-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ inputs.release }}
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Make release
      run: |
        sudo apt install -y hub

        # hub(1) requires release to be created inside a git repo
        git clone https://${{ secrets.CLONE_TOKEN }}:x-oauth-basic@github.com/${{ github.repository }}.git repo
        cd repo

        sdk_paths=$(find ${{ github.workspace }}/artifacts -name 'dotnet-sdk-*.tar.gz')
        artifacts=""
        for sdk_path in $sdk_paths; do
          sdk_filename=$(basename "$sdk_path")
          # Extract version: strip prefix/suffix to get e.g. "10.0.100-preview.5.25277.114"
          sdk_version=$(echo "$sdk_filename" | sed -E 's/dotnet-sdk-([^-]+(-[^-]+)*)-illumos-.+\.tar\.gz/\1/')
          artifacts="$artifacts -a $sdk_path"
          tag_name="$sdk_version"
        done

        echo "tag_name: $tag_name"
        echo "artifacts: $artifacts"

        # docs: https://hub.github.com/hub-release.1.html
        hub release create $artifacts --prerelease -m "$tag_name" "$tag_name"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
